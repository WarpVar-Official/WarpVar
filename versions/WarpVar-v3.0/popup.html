<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WarpVar (3.0)</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: "Courier New", monospace;
      width: 400px;
      margin: 0;
      padding: 16px;
      background-color: #101c25;
      color: #FFFFFF;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .logo {
      width: 48px;
      margin: 0 auto;
      display: block;
    }

    h3 {
      margin-top: 8px;
      font-size: 1.2rem;
      color: #ffffff;
    }

    .beta {
      display: inline-block;
      background: #ff8400;
      color: #FFFFFF;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: -5px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #FFFFFF;
    }

    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .checkbox-text {
      min-width: 0;
      line-height: 1.35;
      white-space: nowrap;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      background-color: #0d151b;
      border: 1px solid #FFFFFF;
      border-radius: 8px;
      color: #808080;
      font-family: monospace;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    select:hover,
    input:hover,
    button:hover {
      background-color: #111;
      box-shadow: 0 0 6px #F0F0F0;
    }

    input[type="checkbox"] {
      width: auto;
      margin-top: 0;
      padding: 0;
      flex: 0 0 auto;
    }

    button {
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      margin-top: 14px;
      background: #111;
      color: #FFFFFF;
      border: none;
      box-shadow: 0 0 10px #F0F0F0;
    }

    button:active {
      transform: scale(0.97);
      box-shadow: 0 0 5px #F0F0F0;
    }

    #result {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #00ffcc;
    }

    .footer {
      margin-top: 14px;
      font-size: 0.7rem;
      text-align: center;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon128.png" alt="WarpVar Logo" class="logo" />
    <h3>WarpVar <span class="beta">3.0</span></h3>
  </div>

  <label>
    Search:
    <input id="searchBar" placeholder="Type to filter..." />
  </label>

  <label>
    Variable:
    <select id="varSelect" size="6">
      <option value="">(Loading...)</option>
    </select>
  </label>

  <label>
    New Value:
    <input id="varValue" placeholder="e.g. 5000" />
  </label>

  <label style="display:block;margin-top:6px;">
    Interval (ms): <input id="intervalMs" placeholder="e.g. 500" />
  </label>

  <br>
  <label class="checkbox-label">
    <input type="checkbox" id="foreverChk">
    <span class="checkbox-text"><strong>Forever</strong> (keep setting repeatedly)</span>
  </label>
  <button id="applyBtn">Apply</button>
  <div id="result"></div>

  <div class="footer">For TurboWarp only</div>

  <script src="popup.js"></script>
</body>
</html>
