<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WarpVar (4.1)</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      @property --border-angle {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }

      html {
        margin: 0;
        background: transparent;
      }

      body {
        font-family: "Courier New", monospace;
        width: 400px;
        margin: 0;
        padding: 16px;
        position: relative;
        background-color: #101c25;
        border-radius: 16px;
        color: #ffffff;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        padding: 2px;
        border-radius: inherit;
        background: conic-gradient(
          from var(--border-angle),
          transparent 0deg,
          transparent 80deg,
          #ffffff 120deg,
          #ff8400 155deg,
          transparent 210deg,
          transparent 360deg
        );
        pointer-events: none;
        animation: borderSpin 2.4s linear infinite;
        transition: opacity 240ms ease;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
      }

      body::after {
        content: "";
        position: absolute;
        inset: 0;
        padding: 2px;
        border-radius: inherit;
        background: conic-gradient(
          from var(--border-angle),
          transparent 0deg,
          transparent 45deg,
          #ff8400 85deg,
          #024968 125deg,
          #ffffff 170deg,
          transparent 230deg,
          transparent 360deg
        );
        opacity: 0;
        pointer-events: none;
        animation: borderSpin 1.2s linear infinite;
        transition: opacity 240ms ease;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
      }

      body.apply-border::after {
        opacity: 1;
        animation:
          borderSpin 1.2s linear infinite,
          applyBorderFlash 650ms ease-out;
      }

      body.apply-border::before {
        opacity: 0;
      }

      body > * {
        position: relative;
        z-index: 1;
      }

      @keyframes borderSpin {
        to {
          --border-angle: 360deg;
        }
      }

      @keyframes applyBorderFlash {
        0% {
          filter: brightness(1.9);
        }
        100% {
          filter: brightness(1);
        }
      }

      .header {
        text-align: center;
        margin-bottom: 16px;
      }

      .logo {
        width: 48px;
        margin: 0 auto;
        display: block;
      }

      h3 {
        margin-top: 8px;
        font-size: 1.2rem;
        color: #ffffff;
      }

      .beta {
        display: inline-block;
        background: #ff8400;
        color: #ffffff;
        font-size: 0.7rem;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 6px;
        margin-left: -5px;
      }

      label {
        display: block;
        margin-top: 12px;
        font-size: 0.9rem;
        color: #ffffff;
      }

      .checkbox-label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .checkbox-text {
        min-width: 0;
        line-height: 1.35;
        white-space: nowrap;
      }

      select,
      input,
      button {
        width: 100%;
        padding: 8px;
        margin-top: 6px;
        background-color: #0d151b;
        border: 1px solid #ffffff;
        border-radius: 8px;
        color: #808080;
        font-family: monospace;
        font-size: 0.9rem;
        transition: 0.2s;
      }

      select:hover,
      input:hover,
      button:hover {
        background-color: #111;
        box-shadow: 0 0 6px #f0f0f0;
      }

      input[type="checkbox"] {
        width: auto;
        margin-top: 0;
        padding: 0;
        flex: 0 0 auto;
      }

      button {
        cursor: pointer;
        text-transform: uppercase;
        font-weight: bold;
        margin-top: 14px;
        background: #111;
        color: #ffffff;
        border: none;
        box-shadow: 0 0 10px #f0f0f0;
      }

      button:active {
        transform: scale(0.97);
        box-shadow: 0 0 5px #f0f0f0;
      }

      button.apply-animate {
        animation: applyPulse 420ms ease-out;
      }

      @keyframes applyPulse {
        0% {
          transform: scale(0.97);
          box-shadow: 0 0 5px #f0f0f0;
        }
        45% {
          transform: scale(1.03);
          box-shadow: 0 0 18px #ffffff;
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 10px #f0f0f0;
        }
      }

      #result {
        margin-top: 12px;
        font-size: 0.8rem;
        color: #00ffcc;
      }

      .locked-variable {
        color: #00ffcc !important;
      }

      select option {
        color: #808080;
      }

      select option:hover {
        color: #808080;
      }

      select option.locked-variable {
        color: #00ffcc;
      }

      .footer {
        margin-top: 14px;
        font-size: 0.7rem;
        text-align: center;
        color: #888;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <img src="icons/icon128.png" alt="WarpVar Logo" class="logo" />
      <h3>WarpVar <span class="beta">4.1</span></h3>
    </div>

    <label>
      Search:
      <input id="searchBar" placeholder="Type to filter..." />
    </label>

    <label>
      Variable:
      <select id="varSelect" size="6">
        <option value="">(Loading...)</option>
      </select>
    </label>

    <label>
      New Value:
      <input id="varValue" placeholder="e.g. 5000" />
    </label>

    <label style="display: none; margin-top: 8px">
      <input
        type="checkbox"
        id="foreverChk"
        style="width: auto; display: none"
        value="true"
        checked
      />
    </label>
    <label style="display: none; margin-top: 6px">
      Interval (ms):
      <input id="intervalMs" placeholder="e.g. 500" style="width: 80px" />
    </label>

    <button id="applyBtn">Apply</button>
    <div id="result"></div>

    <div class="footer">For Scratch & TurboWarp</div>

    <script src="popup.js"></script>
  </body>
</html>
