<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>WarpVar (4.0)</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      background-color: #000000;
      color: #FFFFFF;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .logo {
      width: 48px;
      margin: auto;
      display: block;
    }

    h3 {
      margin-top: 8px;
      font-size: 1.2rem;
      color: #ffffff;
    }

    .beta {
      display: inline-block;
      background: #FF0000;
      color: #FFFFFF;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #FFFFFF;
    }

    select,
    button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      background-color: #111;
      border: 1px solid #FFFFFF;
      border-radius: 8px;
      color: #808080;
      font-family: monospace;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    input {
      width: calc(100% - 16px);
      padding: 8px;
      margin-top: 6px;
      background-color: #111;
      border: 1px solid #FFFFFF;
      border-radius: 8px;
      color: #808080;
      font-family: monospace;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    input:hover,
    button:hover {
      background-color: #FFFFFF;
      color: #0a0a0a;
      box-shadow: 0 0 6px #F0F0F0;
    }

    select:hover {
      color: #0a0a0a;
      box-shadow: 0 0 6px #F0F0F0;
    }

    button {
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      margin-top: 14px;
      background: #FFFFFF;
      color: #0a0a0a;
      border: none;
      box-shadow: 0 0 10px #F0F0F0;
    }

    button:active {
      transform: scale(0.97);
      box-shadow: 0 0 5px #F0F0F0;
    }

    #result {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #000000;
      display: none;
    }

    .footer {
      margin-top: 14px;
      font-size: 0.7rem;
      text-align: center;
      color: #888;
    }

    .button-group {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .button-group button {
      flex: 1;
      margin-top: 0;
      font-size: 0.75rem;
      padding: 6px;
    }

    .stats {
      font-size: 0.75rem;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }

    .locked-variable {
      color: #ffffff !important;
    }

    select option {
      color: #808080;
    }

    select option:hover {
      color: #808080;
    }

    select option.locked-variable {
      color: #ff4444;
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="icons/icon128.png" alt="WarpVar Logo" class="logo" />
    <h3>WarpVar <span class="beta">4.0</span></h3>
  </div>

  <label>
    Search:
    <input id="searchBar" placeholder="Type to filter..." />
  </label>

  <label>
    Variable:
    <select id="varSelect" size="6">
      <option value="">(Loading...)</option>
    </select>
  </label>

  <label>
    New Value:
    <input id="varValue" placeholder="e.g. 5000" />
  </label>

  <label style="display:none;margin-top:8px;">
    <input type="checkbox" id="foreverChk" style="width: auto; display: none;" value="true" checked />
  </label>
  <label style="display:block;margin-top:6px;display:none;">
    Interval (ms): <input id="intervalMs" placeholder="e.g. 500" style="width:80px" />
  </label>

  <button id="applyBtn">Apply</button>
  <div id="result"></div>

  <div class="footer">WarpVar™ (WarpVar 4.0)</div>

  <script src="popup.js"></script>
</body>

</html>
